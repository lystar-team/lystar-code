name: Prepare execution environment dependencies
description: Install the env and durable test dependencies and reuse Windows ARM installations
runs:
  using: composite
  steps:
    - name: Prepare npm cache key
      shell: bash
      run: node scripts/write-npm-cache-key.mjs

    - name: Setup Node.js
      id: node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: .artifacts/npm-cache-key.json

    - name: Restore Windows ARM test dependencies
      if: runner.os == 'Windows' && runner.arch == 'ARM64'
      id: dependencies
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: |
          node_modules
          packages/*/node_modules
        key: env-deps-v1-${{ runner.os }}-${{ runner.arch }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json', '.npmrc', 'package.json', 'packages/*/package.json') }}

    - name: Install execution environment dependencies
      if: steps.dependencies.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci --ignore-scripts --no-audit --no-fund --workspace packages/env --workspace packages/durable --include-workspace-root=false
