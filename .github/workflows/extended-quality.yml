name: Extended quality

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Extended quality suite
        required: true
        default: full
        type: choice
        options: [full, ai-live, coding-live, stress]
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: extended-quality-${{ github.ref }}-${{ github.event_name }}-${{ inputs.suite || 'scheduled' }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24.18.0
  NPM_CI_ARGS: --ignore-scripts --no-audit --no-fund

jobs:
  full:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci $NPM_CI_ARGS

      - name: Run full deterministic suite
        run: npm test

  ai-live:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'ai-live'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: live-provider
    env:
      PI_LIVE_TEST: "1"
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_OAUTH_TOKEN: ${{ secrets.ANTHROPIC_OAUTH_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_OAUTH_TOKEN: ${{ secrets.OPENAI_OAUTH_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci $NPM_CI_ARGS

      - name: Run AI live provider suite
        shell: bash
        run: |
          if [[ -z "$ANTHROPIC_API_KEY$ANTHROPIC_OAUTH_TOKEN$OPENAI_API_KEY$OPENAI_OAUTH_TOKEN$GEMINI_API_KEY$GOOGLE_API_KEY$MISTRAL_API_KEY$OPENROUTER_API_KEY$HF_TOKEN" ]]; then
            echo "No live provider credential configured; suite skipped."
            exit 0
          fi
          npm --workspace @earendil-works/pi-ai run test:live

  coding-live:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'coding-live'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: live-provider
    env:
      PI_LIVE_TEST: "1"
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_OAUTH_TOKEN: ${{ secrets.ANTHROPIC_OAUTH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci $NPM_CI_ARGS

      - name: Run Coding Agent live provider suite
        shell: bash
        run: |
          if [[ -z "$ANTHROPIC_API_KEY$ANTHROPIC_OAUTH_TOKEN" ]]; then
            echo "No Anthropic credential configured; suite skipped."
            exit 0
          fi
          npm --workspace @earendil-works/pi-coding-agent run test:live

  stress:
    if: github.event_name == 'schedule' || inputs.suite == 'stress'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci $NPM_CI_ARGS

      - name: Run stress suite
        run: npm --workspace @earendil-works/pi-coding-agent run test:stress
