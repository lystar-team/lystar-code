name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      plan_mode:
        description: Changed-file planner mode
        required: false
        default: enforce
        type: choice
        options: [enforce, observe]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.18.0
  NPM_CI_ARGS: --ignore-scripts --no-audit --no-fund
  CI_PLAN_MODE: ${{ inputs.plan_mode || 'enforce' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      validate: ${{ steps.planner.outputs.validate }}
      core: ${{ steps.planner.outputs.core }}
      coding: ${{ steps.planner.outputs.coding }}
      web: ${{ steps.planner.outputs.web }}
      platform: ${{ steps.planner.outputs.platform }}
      core_tests: ${{ steps.planner.outputs.core_tests }}
      web_tests: ${{ steps.planner.outputs.web_tests }}
      plan: ${{ steps.planner.outputs.plan }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Plan changed-file gates
        id: planner
        shell: bash
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          node scripts/ci-plan.mjs \
            --base "$CI_BASE" \
            --head "$GITHUB_SHA" \
            --mode "$CI_PLAN_MODE" \
            --github-output "$GITHUB_OUTPUT"

  validate:
    needs: plan
    if: ${{ always() && (needs.plan.result != 'success' || needs.plan.outputs.validate == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci $NPM_CI_ARGS

      - name: Test repository scripts
        run: npm run test:scripts

      - name: Verify repository contracts
        run: npm run check:ci

      - name: Run browser smoke check
        run: npm run check:browser-smoke

  core:
    needs: plan
    if: ${{ always() && (needs.plan.result != 'success' || needs.plan.outputs.core == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI_PLAN: ${{ needs.plan.outputs.plan }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci $NPM_CI_ARGS

      - name: Test affected core workspaces
        run: npm run test:affected -- --suite core --plan-json-env CI_PLAN

  coding:
    needs: plan
    if: ${{ always() && (needs.plan.result != 'success' || needs.plan.outputs.coding == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci $NPM_CI_ARGS

      - name: Test Coding Agent CI suite
        run: npm --workspace @earendil-works/pi-coding-agent run test:ci

  web:
    needs: plan
    if: ${{ always() && (needs.plan.result != 'success' || needs.plan.outputs.web == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI_PLAN: ${{ needs.plan.outputs.plan }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci $NPM_CI_ARGS

      - name: Test affected Web workspaces
        run: npm run test:affected -- --suite web --plan-json-env CI_PLAN

      - name: Verify Web workspace contracts
        run: npm run check:web

  platform:
    needs: plan
    if: ${{ always() && (needs.plan.result != 'success' || needs.plan.outputs.platform == 'true') }}
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9
          bun-download-url: https://github.com/oven-sh/bun/releases/download/bun-v1.3.9/bun-windows-x64-baseline.zip

      - name: Install dependencies
        shell: powershell
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Test Windows platform suites
        shell: powershell
        run: |
          npm --workspace @earendil-works/pi-coding-agent run test:platform
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PI_TEST_SUITE = "platform"
          npm --workspace @earendil-works/pi-agent-core test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  required:
    needs: [plan, validate, core, coding, web, platform]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify selected required gates
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          VALIDATE_SELECTED: ${{ needs.plan.outputs.validate }}
          CORE_SELECTED: ${{ needs.plan.outputs.core }}
          CODING_SELECTED: ${{ needs.plan.outputs.coding }}
          WEB_SELECTED: ${{ needs.plan.outputs.web }}
          PLATFORM_SELECTED: ${{ needs.plan.outputs.platform }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          CORE_RESULT: ${{ needs.core.result }}
          CODING_RESULT: ${{ needs.coding.result }}
          WEB_RESULT: ${{ needs.web.result }}
          PLATFORM_RESULT: ${{ needs.platform.result }}
        shell: bash
        run: |
          if [[ "$PLAN_RESULT" != "success" ]]; then
            echo "The changed-file planner failed; required gates cannot be selected safely." >&2
            exit 1
          fi

          failed=0
          check_gate() {
            local name="$1" selected="$2" result="$3"
            if [[ "$selected" == "true" && "$result" != "success" ]]; then
              echo "Required gate $name is $result." >&2
              failed=1
            fi
          }

          check_gate validate "$VALIDATE_SELECTED" "$VALIDATE_RESULT"
          check_gate core "$CORE_SELECTED" "$CORE_RESULT"
          check_gate coding "$CODING_SELECTED" "$CODING_RESULT"
          check_gate web "$WEB_SELECTED" "$WEB_RESULT"
          check_gate platform "$PLATFORM_SELECTED" "$PLATFORM_RESULT"
          exit "$failed"
