name: Prepare native session index cache

on:
  push:
    branches: [main]
    paths:
      - "packages/web-runtime/native/session-index/**"
      - "scripts/build-session-index.mjs"
      - ".github/actions/session-index/**"
      - ".github/workflows/session-index-cache.yml"

permissions:
  contents: read

jobs:
  native-index:
    strategy:
      fail-fast: true
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build or restore session index
        uses: ./.github/actions/session-index
