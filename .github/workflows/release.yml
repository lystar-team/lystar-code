name: Release LYStar Agent

on:
  push:
    tags:
      - "v*-lystar.*"

permissions:
  actions: read
  contents: write
  id-token: write
  attestations: write

jobs:
  verify-ci:
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful main CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=success&per_page=10" \
            --jq '[.workflow_runs[] | select(.event == "push" and .head_branch == "main")] | length')
          test "$count" -gt 0

  release:
    needs: verify-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build JavaScript packages
        run: npm run build:offline

      - name: Build standalone bundles
        run: |
          bash scripts/build-binaries.sh \
            --skip-install \
            --skip-build \
            --repository "${GITHUB_REPOSITORY}"

      - name: Verify release version
        env:
          TAG: ${{ github.ref_name }}
        run: test "v$(cat packages/coding-agent/binaries/VERSION)" = "$TAG"

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            packages/coding-agent/binaries/*.tar.gz
            packages/coding-agent/binaries/*.zip
            packages/coding-agent/binaries/SHA256SUMS
            packages/coding-agent/binaries/release-manifest.json
            packages/coding-agent/binaries/install.sh
            packages/coding-agent/binaries/install.ps1
            packages/coding-agent/binaries/install.cmd

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --generate-notes \
            packages/coding-agent/binaries/*.tar.gz \
            packages/coding-agent/binaries/*.zip \
            packages/coding-agent/binaries/SHA256SUMS \
            packages/coding-agent/binaries/release-manifest.json \
            packages/coding-agent/binaries/install.sh \
            packages/coding-agent/binaries/install.ps1 \
            packages/coding-agent/binaries/install.cmd
