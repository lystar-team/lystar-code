name: Release LYStar Code

on:
  push:
    tags:
      - "v*-lystar.*"
    branches:
      - "release-ci/**"
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build and verify
        required: true
        default: main
        type: string
      publish:
        description: Create the version tag and GitHub release after candidate verification
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

env:
  NODE_VERSION: 24.18.0
  GO_VERSION: 1.24.4
  PUBLISH_RELEASE: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || inputs.publish == true }}

jobs:
  build-shared:
    name: Build shared JavaScript and Web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Prepare npm cache key
        run: node scripts/write-npm-cache-key.mjs

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: .artifacts/npm-cache-key.json

      - name: Install shared build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --workspace packages/coding-agent --workspace packages/web-gateway --workspace packages/web --include-workspace-root

      - name: Verify release source
        run: npm run check:release

      - name: Build shared packages
        run: npm run build:release-shared

      - name: Upload shared build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-shared-${{ github.run_attempt }}
          path: .artifacts/release-shared.tar
          if-no-files-found: error
          retention-days: 1

  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-15
          - platform: darwin-x64
            runner: macos-15-intel
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: windows-x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Prepare npm cache key
        run: node scripts/write-npm-cache-key.mjs

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: .artifacts/npm-cache-key.json

      - name: Restore native session index
        id: native-index
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: packages/coding-agent/dist/native/session-index
          key: session-index-${{ runner.os }}-${{ runner.arch }}-go${{ env.GO_VERSION }}-${{ hashFiles('packages/web-runtime/native/session-index/**', 'scripts/build-session-index.mjs') }}

      - name: Setup Go (build only)
        if: steps.native-index.outputs.cache-hit != 'true'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: packages/web-runtime/native/session-index/go.sum

      - name: Build native session index
        if: steps.native-index.outputs.cache-hit != 'true'
        run: node scripts/build-session-index.mjs

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
          bun-download-url: ${{ matrix.platform == 'windows-x64' && 'https://github.com/oven-sh/bun/releases/download/bun-v1.4.2/bun-windows-x64-baseline.zip' || '' }}

      - name: Install platform dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --workspace packages/coding-agent --workspace packages/web-gateway --include-workspace-root

      - name: Wait for shared build
        id: shared
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/wait-release-shared.mjs

      - name: Download shared build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ steps.shared.outputs.artifact-id }}
          path: .artifacts/shared
          merge-multiple: true

      - name: Restore shared packages
        run: tar -xf .artifacts/shared/release-shared.tar

      - name: Build Unix standalone release
        if: runner.os != 'Windows'
        run: |
          bash scripts/build-binaries.sh \
            --skip-install \
            --skip-build \
            --platform "${{ matrix.platform }}" \
            --repository "${GITHUB_REPOSITORY}"

      - name: Verify Unix release artifact
        if: runner.os != 'Windows'
        run: |
          version="$(node -p "require('./packages/coding-agent/package.json').piConfig.productVersion")"
          archive="packages/coding-agent/binaries/lystar-agent-v${version}-${{ matrix.platform }}.tar.gz"
          test "$(cat packages/coding-agent/binaries/VERSION)" = "$version"
          test -f "$archive"
          test "$(find packages/coding-agent/binaries -maxdepth 1 -name '*.tar.gz' | wc -l | tr -d '[:space:]')" = "1"
          tar -tzf "$archive" > archive-contents.txt
          for entry in lc lystar package.json photon_rs_bg.wasm skills/imagegen/SKILL.md web/index.html web/version.json; do
            grep -Fxq "lystar-agent/$entry" archive-contents.txt
          done
          grep -Fxq "lystar-agent/native/session-index/${{ matrix.platform }}/lystar-session-index" archive-contents.txt
          ! grep -Fxq 'lystar-agent/la' archive-contents.txt
          rm archive-contents.txt

      - name: Build Windows standalone release
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\build-windows-release.ps1 -Repository "${env:GITHUB_REPOSITORY}"

      - name: Verify Windows release artifact
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $Version = (Get-Content packages/coding-agent/package.json | ConvertFrom-Json).piConfig.productVersion
          $Bundle = "packages/coding-agent/binaries/windows-x64/lystar-agent"
          $Archives = @(Get-ChildItem packages/coding-agent/binaries -Filter "lystar-agent-*-windows-x64.zip")
          if ($Archives.Count -ne 1) { throw "Expected exactly one Windows release archive" }
          if ((& "$Bundle/lc.exe" --version | Out-String).Trim() -ne $Version) { throw "lc.exe version mismatch" }
          foreach ($RequiredFile in @("lystar.cmd", "lystar-web-service.exe", "skills/imagegen/SKILL.md", "web/index.html", "web/version.json", "native/session-index/win32-x64/lystar-session-index.exe")) {
            if (!(Test-Path "$Bundle/$RequiredFile")) { throw "Windows release bundle is missing $RequiredFile" }
          }
          if (Test-Path "$Bundle/la.exe") { throw "legacy la.exe must not be shipped" }

      - name: Upload platform release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-platform-${{ matrix.platform }}-${{ github.run_attempt }}
          path: packages/coding-agent/binaries/lystar-agent-*-${{ matrix.platform }}.*
          compression-level: 0
          if-no-files-found: error

  publish:
    name: Verify release candidate and publish
    needs: [build-shared, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download platform release candidates
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-platform-*-${{ github.run_attempt }}
          path: packages/coding-agent/binaries
          merge-multiple: true

      - name: Generate and verify release metadata
        shell: bash
        run: |
          version="$(node -p "require('./packages/coding-agent/package.json').piConfig.productVersion")"
          node scripts/generate-release-metadata.mjs packages/coding-agent/binaries "$version" "${GITHUB_REPOSITORY}"
          printf '%s\n' "$version" > packages/coding-agent/binaries/VERSION
          test "$(find packages/coding-agent/binaries -maxdepth 1 \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l | tr -d '[:space:]')" = "5"
          (
            cd packages/coding-agent/binaries
            sha256sum -c SHA256SUMS
          )
          node scripts/generate-release-metadata.mjs --verify packages/coding-agent/binaries "$version" "${GITHUB_REPOSITORY}"

      - name: Upload verified release candidate
        if: env.PUBLISH_RELEASE != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate-verified-${{ github.run_attempt }}
          path: packages/coding-agent/binaries
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

      - name: Create version tag after candidate verification
        if: env.PUBLISH_RELEASE == 'true'
        id: tag
        shell: bash
        run: |
          version="$(cat packages/coding-agent/binaries/VERSION)"
          tag="v${version}"
          if [[ "${{ github.event_name }}" == "push" ]]; then
            if [[ "$GITHUB_REF_NAME" != "$tag" ]]; then
              echo "Pushed tag $GITHUB_REF_NAME does not match release version $tag" >&2
              exit 1
            fi
          else
            git fetch origin --tags
            source_sha="$(git rev-parse HEAD)"
            remote_tag_sha="$(git ls-remote origin "refs/tags/${tag}^{}" | awk '{print $1}')"
            if [[ -z "$remote_tag_sha" ]]; then
              remote_tag_sha="$(git ls-remote origin "refs/tags/${tag}" | awk '{print $1}')"
            fi
            if [[ -n "$remote_tag_sha" ]]; then
              if [[ "$remote_tag_sha" != "$source_sha" ]]; then
                echo "Release tag ${tag} points to ${remote_tag_sha}, expected ${source_sha}" >&2
                exit 1
              fi
              echo "Reusing release tag ${tag} at ${source_sha}"
            else
              git tag -a "$tag" "$source_sha" -m "LYStar Code $tag" -m "本版紧急修复。"
              git push origin "$tag"
            fi
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Generate Chinese release notes
        if: env.PUBLISH_RELEASE == 'true'
        id: release-notes
        shell: bash
        run: |
          version="${{ steps.tag.outputs.version }}"
          tag="${{ steps.tag.outputs.tag }}"
          heading="## [${version}]"
          notes_path="${RUNNER_TEMP}/release-notes.md"
          {
            printf '# LYStar Code v%s\n\n' "$version"
            awk -v heading="$heading" '
              index($0, heading) == 1 { capture = 1; next }
              capture && /^## \[/ { exit }
              capture { print }
            ' packages/coding-agent/CHANGELOG.md
            previous_tag="$(git describe --tags --match 'v*-lystar.*' --abbrev=0 "${tag}^" 2>/dev/null || true)"
            if [[ -n "$previous_tag" ]]; then
              printf '\n**完整提交对比**：https://github.com/%s/compare/%s...%s\n' \
                "$GITHUB_REPOSITORY" "$previous_tag" "$tag"
            fi
          } > "$notes_path"
          if ! grep -q '^### ' "$notes_path"; then
            echo "No changelog section found for ${version}" >&2
            exit 1
          fi
          echo "path=$notes_path" >> "$GITHUB_OUTPUT"

      - name: Attest release artifacts
        if: env.PUBLISH_RELEASE == 'true'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            packages/coding-agent/binaries/*.tar.gz
            packages/coding-agent/binaries/*.zip
            packages/coding-agent/binaries/SHA256SUMS
            packages/coding-agent/binaries/release-manifest.json
            packages/coding-agent/binaries/install.sh
            packages/coding-agent/binaries/install.ps1
            packages/coding-agent/binaries/install.cmd

      - name: Publish GitHub release
        if: env.PUBLISH_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          notes_path="${{ steps.release-notes.outputs.path }}"
          assets=(
            packages/coding-agent/binaries/*.tar.gz
            packages/coding-agent/binaries/*.zip
            packages/coding-agent/binaries/SHA256SUMS
            packages/coding-agent/binaries/release-manifest.json
            packages/coding-agent/binaries/install.sh
            packages/coding-agent/binaries/install.ps1
            packages/coding-agent/binaries/install.cmd
          )
          if gh release view "$tag" --repo lystar-team/lystar-code >/dev/null 2>&1; then
            gh release edit "$tag" --repo lystar-team/lystar-code --title "$tag" --notes-file "$notes_path"
            gh release upload "$tag" --repo lystar-team/lystar-code --clobber "${assets[@]}"
          else
            gh release create "$tag" --repo lystar-team/lystar-code \
              --verify-tag \
              --title "$tag" \
              --notes-file "$notes_path" \
              "${assets[@]}"
          fi
