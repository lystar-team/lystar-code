name: Release LYStar Agent

on:
  push:
    tags:
      - "v*-lystar.*"

permissions:
  actions: read
  contents: write
  id-token: write
  attestations: write

env:
  NODE_VERSION: 22.19.0
  NPM_CI_ARGS: --ignore-scripts --no-audit --no-fund

jobs:
  verify-ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Wait for successful main CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=""
          for _ in {1..20}; do
            run_id=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&per_page=10" \
              --jq '[.workflow_runs[] | select(.event == "push" and .head_branch == "main")] | first | .id // empty')
            [[ -n "$run_id" ]] && break
            sleep 3
          done
          if [[ -z "$run_id" ]]; then
            echo "No main push CI found for ${GITHUB_SHA}" >&2
            exit 1
          fi
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 10

  release:
    needs: verify-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9

      - name: Verify source version
        env:
          TAG: ${{ github.ref_name }}
        run: test "v$(node -p "require('./packages/coding-agent/package.json').piConfig.productVersion")" = "$TAG"

      - name: Install dependencies
        run: npm ci $NPM_CI_ARGS

      - name: Build JavaScript packages
        run: npm run build:offline

      - name: Build standalone bundles
        run: |
          bash scripts/build-binaries.sh \
            --skip-install \
            --skip-build \
            --repository "${GITHUB_REPOSITORY}"

      - name: Verify release artifacts
        env:
          TAG: ${{ github.ref_name }}
        run: test "v$(cat packages/coding-agent/binaries/VERSION)" = "$TAG"

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            packages/coding-agent/binaries/*.tar.gz
            packages/coding-agent/binaries/*.zip
            packages/coding-agent/binaries/SHA256SUMS
            packages/coding-agent/binaries/release-manifest.json
            packages/coding-agent/binaries/install.sh
            packages/coding-agent/binaries/install.ps1
            packages/coding-agent/binaries/install.cmd

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --generate-notes \
            packages/coding-agent/binaries/*.tar.gz \
            packages/coding-agent/binaries/*.zip \
            packages/coding-agent/binaries/SHA256SUMS \
            packages/coding-agent/binaries/release-manifest.json \
            packages/coding-agent/binaries/install.sh \
            packages/coding-agent/binaries/install.ps1 \
            packages/coding-agent/binaries/install.cmd
