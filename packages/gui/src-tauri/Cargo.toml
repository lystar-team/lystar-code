[package]
name = "lystar-code-gui"
version = "0.84.1-lystar-gui.6"
description = "LYStar Code desktop GUI"
authors = ["Yean"]
license = "MIT"
repository = "https://github.com/lystar-team/lystar-code"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "lystar_code_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
keyring = "=4.1.5"
tauri = { version = "=2.11.3", features = [] }
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-opener = "=2.5.4"
window-vibrancy = "=0.6.0"
