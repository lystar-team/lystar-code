<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LYStar Code · 紧凑执行区参考</title>
<style>
:root { color-scheme: light; --bg: #fff; --ink: #111; --muted: #767676; --line: #eee; --soft: #f5f5f5; --danger: #c52b22; }
* { box-sizing: border-box; }
body { margin: 0; color: var(--ink); background: var(--bg); font-family: Inter, system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; }
.icon-definitions { position: absolute; width: 0; height: 0; overflow: hidden; }
.execution-demo { max-width: 1120px; margin: 0 auto; padding: 24px; }
.execution-demo p { margin: 0; font-size: 15px; line-height: 1.78; }
.execution-demo .intro { margin-bottom: 12px; }
.execution-demo .icon { display: block; width: 16px; height: 16px; flex: 0 0 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.execution-demo .small-icon { width: 12px; height: 12px; flex-basis: 12px; }
.execution-demo summary { cursor: pointer; list-style: none; }
.execution-demo summary::-webkit-details-marker { display: none; }
.execution-demo button { appearance: none; font: inherit; background: transparent; border: 0; color: inherit; cursor: pointer; }
.execution-demo button:focus-visible, .execution-demo summary:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 3px; }
.execution-demo .step-header { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto 16px; align-items: center; gap: 8px; min-height: 28px; padding: 2px 0; }
.execution-demo .step-title { font-size: 14px; font-weight: 600; line-height: 22px; overflow-wrap: anywhere; }
.execution-demo .step-time { font-size: 12px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.execution-demo .chevron { color: var(--muted); transform: rotate(-90deg); }
.execution-demo .step[open] > .step-header .chevron, .execution-demo .all-records[open] > summary .chevron { transform: none; }
.execution-demo .step-body { margin: 0; padding: 4px 0 0; }
.execution-demo .tool-row { display: flex; flex-wrap: wrap; align-items: center; gap: 0 8px; min-width: 0; min-height: 28px; font-size: 13px; line-height: 22px; }
.execution-demo .row-label { display: inline-flex; align-items: center; gap: 6px; min-height: 28px; color: var(--muted); white-space: nowrap; }
.execution-demo .object { display: inline-flex; align-items: center; gap: 5px; min-width: 0; max-width: 100%; min-height: 28px; padding: 0 2px; border-radius: 3px; }
.execution-demo .object:hover { background: var(--soft); }
.execution-demo .object:hover code { text-decoration: underline; text-underline-offset: 3px; }
.execution-demo code { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 13px; line-height: 22px; overflow-wrap: anywhere; }
.execution-demo .object code { min-width: 0; }
.execution-demo .count { font-size: 11px; color: var(--muted); }
.execution-demo .error { color: var(--danger); }
.execution-demo .error-text { font-size: 11px; color: var(--danger); white-space: nowrap; }
.execution-demo .more { color: var(--muted); font-size: 12px; }
.execution-demo #more-files { display: contents; }
.execution-demo [hidden] { display: none !important; }
.execution-demo .commentary { margin: 8px 0 4px; }
.execution-demo .skill-row { color: var(--muted); }
.execution-demo .skill-row code { color: var(--ink); }
.execution-demo .live-state { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); white-space: nowrap; }
.execution-demo .all-records { margin-top: 4px; }
.execution-demo .all-records > summary { display: inline-flex; gap: 6px; align-items: center; min-height: 28px; color: var(--muted); font-size: 12px; }
.execution-demo .record-count { color: var(--muted); font-variant-numeric: tabular-nums; }
.execution-demo .trace { margin-top: 6px; border-top: 1px solid var(--line); padding-top: 6px; }
.execution-demo .trace-heading { display: flex; align-items: center; gap: 8px; min-height: 32px; font-size: 13px; font-weight: 500; }
.execution-demo .close-trace { margin-left: auto; display: grid; place-items: center; min-width: 32px; min-height: 32px; color: var(--muted); }
.execution-demo .record { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 6px 8px; align-items: start; padding: 6px 0; border-bottom: 1px solid var(--line); }
.execution-demo .record:last-child { border-bottom: 0; }
.execution-demo .record > .icon { margin-top: 3px; color: var(--muted); }
.execution-demo .record-status { font-size: 11px; line-height: 22px; color: var(--muted); white-space: nowrap; }
.execution-demo .record-status.error { color: var(--danger); }
.execution-demo .record-range { grid-column: 2; font-size: 11px; line-height: 16px; color: var(--muted); }
.execution-demo .caption { margin-top: 16px; color: var(--muted); font-size: 11px; line-height: 1.6; }
@media (max-width: 640px) {
  .execution-demo { padding: 16px; }
  .execution-demo .step-header { grid-template-columns: 16px minmax(0, 1fr) 16px; min-height: 44px; gap: 0 8px; }
  .execution-demo .step-header > .status-icon { grid-column: 1; grid-row: 1; align-self: start; margin-top: 3px; }
  .execution-demo .step-title { grid-column: 2; grid-row: 1; }
  .execution-demo .step-time { grid-column: 2; grid-row: 2; line-height: 18px; }
  .execution-demo .step-header > .chevron { grid-column: 3; grid-row: 1 / span 2; }
  .execution-demo .object, .execution-demo .row-label, .execution-demo .all-records > summary { min-height: 44px; }
  .execution-demo .more { min-width: 44px; }
  .execution-demo .tool-row { gap: 0 6px; }
  .execution-demo .close-trace { min-width: 44px; min-height: 44px; }
  .execution-demo .trace-heading { min-height: 44px; }
}
@media (prefers-color-scheme: dark) {
  :root { color-scheme: dark; --bg: #151515; --ink: #f4f4f4; --muted: #b0b0b0; --line: #3b3b3b; --soft: #292929; --danger: #ff7168; }
}
</style>
</head>
<body>
<!-- 图标节点来自项目已安装的 lucide-react：FileText、Search、Terminal、LoaderCircle、ChevronDown、CircleX、Sparkles。 -->
<svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <symbol id="file" viewBox="0 0 24 24"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5M10 9H8M16 13H8M16 17H8"/></symbol>
    <symbol id="search" viewBox="0 0 24 24"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></symbol>
    <symbol id="terminal" viewBox="0 0 24 24"><path d="M12 19h8m-16-2 6-6-6-6"/></symbol>
    <symbol id="loader" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></symbol>
    <symbol id="chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="error" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6m0-6 6 6"/></symbol>
    <symbol id="skill" viewBox="0 0 24 24"><path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594zM20 2v4m2-2h-4"/><circle cx="4" cy="20" r="2"/></symbol>
  </defs>
</svg>
<main class="execution-demo" aria-label="执行内容区设计参考">
  <p class="intro">Yean，我会先核对当前实现与未提交改动，再补齐任务执行、职责路由和产物接收。</p>
  <details class="step" open>
    <summary class="step-header" aria-label="核对任务执行、职责路由与产物接收链路，运行中，展开或收起">
      <svg class="icon status-icon" aria-hidden="true"><use href="#loader"/></svg>
      <span class="step-title">核对任务执行、职责路由与产物接收链路</span>
      <span class="step-time">2分41秒</span>
      <svg class="icon chevron" aria-hidden="true"><use href="#chevron"/></svg>
    </summary>
    <div class="step-body">
      <div class="tool-row" role="group" aria-label="读取文件">
        <span class="row-label"><svg class="icon" aria-hidden="true"><use href="#file"/></svg>读取</span>
        <button class="object" data-resource="service" aria-label="查看 service.ts 的3次读取记录"><code>service.ts</code><span class="count">×3</span></button>
        <button class="object" data-resource="coordinator" aria-label="查看 session-coordinator.ts 的读取记录"><code>session-coordinator.ts</code></button>
        <button class="object" data-resource="types" aria-label="查看 types.ts 的出错记录"><code>types.ts</code><svg class="icon small-icon error" aria-hidden="true"><use href="#error"/></svg><span class="error-text">出错</span></button>
        <button class="object more" id="more-toggle" aria-expanded="false" aria-controls="more-files">+2</button>
        <span id="more-files" hidden>
          <button class="object" data-resource="room-router" aria-label="查看 session-room-router.ts 的读取记录"><code>session-room-router.ts</code></button>
          <button class="object" data-resource="room-coordinator" aria-label="查看 session-room-coordinator.ts 的读取记录"><code>session-room-coordinator.ts</code></button>
        </span>
      </div>
      <div class="tool-row" role="group" aria-label="检索">
        <span class="row-label"><svg class="icon" aria-hidden="true"><use href="#search"/></svg>检索</span>
        <button class="object" data-resource="search" aria-label="查看协作路由检索记录"><code>one_of_us · route · execution</code></button>
      </div>
      <div class="tool-row" role="group" aria-label="命令执行">
        <span class="row-label"><svg class="icon" aria-hidden="true"><use href="#terminal"/></svg>命令</span>
        <button class="object" data-resource="status" aria-label="查看 git status --short 的执行记录"><code>git status --short</code></button>
        <button class="object" data-resource="diff" aria-label="查看 git diff 的执行记录"><code>git diff</code></button>
      </div>
      <p class="commentary">实现范围落在现有 Store、Coordinator、Runtime 和 workspace 职责内。接着核对会话协调与产物接收。</p>
      <div class="tool-row skill-row" role="group" aria-label="技能加载">
        <span class="row-label"><svg class="icon" aria-hidden="true"><use href="#skill"/></svg>已加载</span>
        <button class="object" data-resource="skill" aria-label="查看 yean-develop-style 的加载记录"><code>yean-develop-style</code></button>
      </div>
      <div class="tool-row" role="group" aria-label="正文之后的读取活动">
        <span class="row-label"><svg class="icon" aria-hidden="true"><use href="#file"/></svg>读取</span>
        <button class="object" data-resource="manager" aria-label="查看 session-manager.ts 的读取记录"><code>session-manager.ts</code></button>
        <button class="object" data-resource="room" aria-label="查看 session-room.ts 的读取记录"><code>session-room.ts</code></button>
        <button class="object" data-resource="collaboration" aria-label="查看 collaboration-workspace.ts 的运行记录"><code>collaboration-workspace.ts</code><span class="live-state"><svg class="icon small-icon" aria-hidden="true"><use href="#loader"/></svg>运行中</span></button>
      </div>
      <section class="trace" id="selected-trace" hidden aria-label="当前对象的调用记录">
        <div class="trace-heading"><svg class="icon" id="selected-icon" aria-hidden="true"><use href="#file"/></svg><span id="selected-title"></span><button class="close-trace" id="close-trace" aria-label="关闭对象记录"><svg class="icon" aria-hidden="true"><use href="#error"/></svg></button></div>
        <div id="selected-records"></div>
      </section>
      <details class="all-records" id="all-records">
        <summary><svg class="icon small-icon chevron" aria-hidden="true"><use href="#chevron"/></svg>执行记录<span class="record-count" id="record-count"></span></summary>
        <div class="trace" id="chronological-records"></div>
      </details>
    </div>
  </details>
  <p class="caption">执行区设计参考 · 内容与状态为示例 · 文件名可查看调用记录 · 输入框保持现有组件</p>
</main>
<script>
const records = [
  { resource: "status", icon: "terminal", label: "git status --short", status: "已完成" },
  { resource: "diff", icon: "terminal", label: "git diff", status: "已完成" },
  { resource: "service", icon: "file", label: "packages/web-runtime/src/service.ts", range: "第1–400行", status: "已完成" },
  { resource: "service", icon: "file", label: "packages/web-runtime/src/service.ts", range: "第540–758行", status: "已完成" },
  { resource: "service", icon: "file", label: "packages/web-runtime/src/service.ts", range: "第780–1198行", status: "已完成" },
  { resource: "coordinator", icon: "file", label: "packages/coding-agent/src/core/session-coordinator.ts", range: "第1–681行", status: "已完成" },
  { resource: "types", icon: "file", label: "packages/web-runtime/src/types.ts", range: "第320–639行", status: "出错" },
  { resource: "search", icon: "search", label: "one_of_us · route · execution", status: "已完成" },
  { resource: "room-router", icon: "file", label: "packages/web-runtime/src/session-room-router.ts", range: "第1–118行", status: "已完成" },
  { resource: "room-coordinator", icon: "file", label: "packages/web-runtime/src/session-room-coordinator.ts", range: "第430–609行", status: "已完成" },
  { resource: "skill", icon: "skill", label: "yean-develop-style", status: "已完成" },
  { resource: "manager", icon: "file", label: "packages/coding-agent/src/core/session-manager.ts", range: "第1–220行", status: "已完成" },
  { resource: "room", icon: "file", label: "packages/coding-agent/src/core/session-room.ts", range: "第1–197行", status: "已完成" },
  { resource: "collaboration", icon: "file", label: "packages/web-runtime/src/collaboration-workspace.ts", status: "运行中" }
];
const selectedTrace = document.getElementById("selected-trace");
const selectedRecords = document.getElementById("selected-records");
let traceTrigger;
function recordElement(record) {
  const row = document.createElement("div");
  row.className = "record";
  const icon = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  icon.classList.add("icon");
  icon.setAttribute("aria-hidden", "true");
  const use = document.createElementNS("http://www.w3.org/2000/svg", "use");
  use.setAttribute("href", `#${record.icon}`);
  icon.append(use);
  const label = document.createElement("code");
  label.textContent = record.label;
  const status = document.createElement("span");
  status.className = record.status === "出错" ? "record-status error" : "record-status";
  status.textContent = record.status;
  row.append(icon, label, status);
  if (record.range) {
    const range = document.createElement("span");
    range.className = "record-range";
    range.textContent = record.range;
    row.append(range);
  }
  return row;
}
document.getElementById("record-count").textContent = `${records.length}条`;
document.getElementById("chronological-records").append(...records.map(recordElement));
document.querySelectorAll("[data-resource]").forEach((button) => {
  button.addEventListener("click", () => {
    const matching = records.filter((record) => record.resource === button.dataset.resource);
    selectedRecords.replaceChildren(...matching.map(recordElement));
    document.getElementById("selected-title").textContent = `${button.querySelector("code").textContent} · ${matching.length}条记录`;
    document.querySelector("#selected-icon use").setAttribute("href", `#${matching[0].icon}`);
    selectedTrace.hidden = false;
    traceTrigger = button;
    document.getElementById("close-trace").focus({ preventScroll: true });
  });
});
document.getElementById("close-trace").addEventListener("click", () => {
  selectedTrace.hidden = true;
  traceTrigger.focus({ preventScroll: true });
});
document.getElementById("more-toggle").addEventListener("click", (event) => {
  const more = document.getElementById("more-files");
  more.hidden = !more.hidden;
  event.currentTarget.setAttribute("aria-expanded", String(!more.hidden));
  event.currentTarget.textContent = more.hidden ? "+2" : "收起";
});
</script>
</body>
</html>
