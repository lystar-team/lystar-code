<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#ffffff" />
		<link rel="manifest" href="/manifest.webmanifest?v=white" />
		<link rel="apple-touch-icon" sizes="180x180" href="/brand/lystar-apple-touch-icon-180.png?v=white" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="LYStar Code" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="color-scheme" content="light dark" />
		<script>
			(() => {
				const theme = window.localStorage.getItem("lystar.web.theme");
				const dark = theme === "dark" || (theme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
				document.documentElement.dataset.theme = theme === "light" || theme === "dark" ? theme : "";
				document.querySelector('meta[name="theme-color"]')?.setAttribute("content", dark ? "#151515" : "#ffffff");
				document
					.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]')
					?.setAttribute("content", dark ? "black-translucent" : "default");
			})();
		</script>
		<meta name="description" content="LYStar Code 本机 Agent Web 工作台" />
		<link rel="icon" type="image/png" sizes="32x32" href="/brand/lystar-favicon-32.png?v=white" />
		<link rel="icon" type="image/png" sizes="48x48" href="/brand/lystar-favicon-48.png?v=white" />
		<title>LYStar Code Web工作台</title>
	</head>
	<body>
		<div id="app"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
