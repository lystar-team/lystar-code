<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
		<meta name="theme-color" content="#ffffff" />
		<link rel="manifest" href="/manifest.webmanifest?v=white" />
		<link rel="apple-touch-icon" sizes="180x180" href="/brand/lystar-apple-touch-icon-180.png?v=white" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="LYStar Code" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="color-scheme" content="light dark" />
		<script src="/startup.js?v=1"></script>
		<style>
			#startup-error {
				position: fixed;
				inset: 0;
				z-index: 10000;
				box-sizing: border-box;
				padding: max(24px, env(safe-area-inset-top)) 24px;
				background: var(--bg, #ffffff);
				color: var(--text, #111111);
				font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			}
			#startup-error h1 {
				margin: 0 0 12px;
				font-size: 20px;
				font-weight: 600;
			}
			#startup-error p {
				margin: 0 0 20px;
			}
			#startup-error a {
				color: inherit;
				text-decoration: underline;
				text-underline-offset: 4px;
			}
		</style>
		<meta name="description" content="LYStar Code 本机 Agent Web 工作台" />
		<link rel="icon" type="image/png" sizes="32x32" href="/brand/lystar-favicon-32.png?v=white" />
		<link rel="icon" type="image/png" sizes="48x48" href="/brand/lystar-favicon-48.png?v=white" />
		<title>LYStar Code Web工作台</title>
	</head>
	<body>
		<div id="app"></div>
		<section id="startup-error" role="alert" hidden>
			<h1>页面资源加载失败</h1>
			<p>请重新加载页面。如果仍然失败，请重新安装当前版本。</p>
			<a href="">重新加载</a>
		</section>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
